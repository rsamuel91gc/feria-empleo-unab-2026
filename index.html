<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <title>Portal Oficial • Feria de Empleo UNAB 2026</title>
  <link rel="icon" type="image/png" href="https://unab.edu.sv/wp-content/uploads/2021/04/cropped-favicon-unab-32x32.png">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #002B49;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    /* Contenedor Geométrico Anti-Banner (Aísla y Recorta el Banner Superior de Apps Script) */
    .portal-viewport-wrapper {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
    }
    /* Iframe Responsivo con Desplazamiento Negativo Quirúrgico de -38px */
    iframe.portal-app-frame {
      position: absolute;
      top: -38px; /* Oculta al 100% la barra de advertencia azul de Google Apps Script */
      left: 0;
      width: 100vw;
      height: calc(100vh + 38px);
      height: calc(100dvh + 38px);
      border: none;
      display: block;
      margin: 0;
      padding: 0;
      background: #002B49;
    }
    /* Splash de Carga Institucional Suave mientras el Iframe inicia */
    #portal-splash-loader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #002B49;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.4s ease, visibility 0.4s ease;
      color: #FFFFFF;
    }
    .portal-spinner {
      width: 44px;
      height: 44px;
      border: 4px solid rgba(255, 255, 255, 0.2);
      border-top-color: #FCD34D;
      border-radius: 50%;
      animation: portalSpin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes portalSpin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <!-- Loader Institucional UNAB -->
  <div id="portal-splash-loader">
    <div class="portal-spinner"></div>
    <div style="font-weight: 800; font-size: 1.05rem; letter-spacing: 0.5px; color: #FFFFFF; text-align: center;">UNIVERSIDAD DR. ANDRÉS BELLO</div>
    <div style="font-size: 0.82rem; color: #94A3B8; margin-top: 4px;">Feria de Empleo UNAB 2026 &bull; Conectando al Servidor Oficial...</div>
  </div>

  <!-- Contenedor Maestro Anti-Banner -->
  <div class="portal-viewport-wrapper">
    <iframe
      id="portal-iframe"
      class="portal-app-frame"
      frameborder="0"
      allowfullscreen
      loading="eager"
      allow="clipboard-write; encrypted-media; camera; microphone"
      onload="ocultarLoaderPortal()">
    </iframe>
  </div>

  <script>
    // URL Base Canónica de Producción de Google Apps Script
    var GAS_BASE_URL = "https://script.google.com/macros/s/AKfycbykgkxwt7T8R3HXjWsS80V50yaPjoYRZGydnqbHrtu3EIiLbXM_bIpyw5pkTOqEZ0o5tg/exec";

    function inicializarPortal() {
      var iframe = document.getElementById("portal-iframe");
      if (!iframe) return;

      // Obtener los parámetros de consulta actuales (?view=staff, ?view=print&id=CV-001, etc.)
      var currentSearch = window.location.search || "";
      var currentHash = window.location.hash || "";

      // Si no se suministra vista, redirigir por defecto a view=registro
      if (!currentSearch || currentSearch.indexOf("view=") === -1) {
        currentSearch = currentSearch ? (currentSearch + "&view=registro") : "?view=registro";
      }

      var destinoFinal = GAS_BASE_URL + currentSearch + currentHash;
      iframe.src = destinoFinal;
    }

    function ocultarLoaderPortal() {
      var loader = document.getElementById("portal-splash-loader");
      if (loader) {
        loader.style.opacity = "0";
        loader.style.visibility = "hidden";
        setTimeout(function() {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 500);
      }
    }

    // Inicializar inmediatamente
    inicializarPortal();

    // Fallback de seguridad: remover loader tras 4 segundos si el evento onload tarda
    setTimeout(ocultarLoaderPortal, 4000);
  </script>
</body>
</html>
